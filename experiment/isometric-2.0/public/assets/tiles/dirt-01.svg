<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- dirt-01: Packed earth with pebbles and color variation -->
  <rect width="128" height="128" fill="#8B6914"/>
  <!-- Earth patches -->
  <ellipse cx="45" cy="40" rx="28" ry="22" fill="#7a5c12" opacity="0.5"/>
  <ellipse cx="90" cy="90" rx="24" ry="18" fill="#9a7618" opacity="0.4"/>
  <ellipse cx="20" cy="80" rx="20" ry="16" fill="#6a5010" opacity="0.35"/>
  <ellipse cx="80" cy="20" rx="22" ry="14" fill="#8a6816" opacity="0.4"/>
  <!-- Pebbles -->
  <g fill="#a08030" opacity="0.5">
    <ellipse cx="30" cy="55" rx="4" ry="3"/>
    <ellipse cx="72" cy="38" rx="3" ry="2.5"/>
    <ellipse cx="95" cy="72" rx="3.5" ry="2.5"/>
    <ellipse cx="55" cy="95" rx="4" ry="2.8"/>
    <ellipse cx="18" cy="25" rx="3" ry="2"/>
    <ellipse cx="108" cy="48" rx="2.5" ry="2"/>
  </g>
  <!-- Small shadows under pebbles -->
  <g fill="#5a4008" opacity="0.25">
    <ellipse cx="31" cy="57" rx="4.5" ry="1.5"/>
    <ellipse cx="73" cy="40" rx="3.5" ry="1.2"/>
    <ellipse cx="96" cy="74" rx="4" ry="1.3"/>
    <ellipse cx="56" cy="97" rx="4.5" ry="1.5"/>
  </g>
  <!-- Tiny cracks -->
  <g stroke="#6a5010" stroke-width="0.8" opacity="0.35">
    <polyline points="40,70 48,74 52,72" fill="none"/>
    <polyline points="80,50 86,55 92,52" fill="none"/>
    <polyline points="60,20 65,25 62,30" fill="none"/>
  </g>
</svg>
