<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- grass-01: Lush meadow grass with subtle variation -->
  <rect width="128" height="128" fill="#3a7d44"/>
  <!-- Color variation patches -->
  <ellipse cx="32" cy="38" rx="22" ry="18" fill="#458550" opacity="0.6"/>
  <ellipse cx="88" cy="78" rx="26" ry="20" fill="#2d6838" opacity="0.5"/>
  <ellipse cx="64" cy="16" rx="18" ry="12" fill="#448040" opacity="0.45"/>
  <ellipse cx="20" cy="95" rx="20" ry="16" fill="#3d8848" opacity="0.5"/>
  <ellipse cx="100" cy="30" rx="16" ry="14" fill="#357540" opacity="0.4"/>
  <!-- Grass blade details -->
  <g stroke="#5a9a64" stroke-width="1.2" stroke-linecap="round" opacity="0.55">
    <line x1="20" y1="32" x2="19" y2="22"/>
    <line x1="24" y1="34" x2="26" y2="24"/>
    <line x1="50" y1="58" x2="48" y2="48"/>
    <line x1="54" y1="62" x2="56" y2="52"/>
    <line x1="80" y1="88" x2="82" y2="78"/>
    <line x1="76" y1="85" x2="74" y2="75"/>
    <line x1="102" y1="42" x2="100" y2="32"/>
    <line x1="38" y1="100" x2="40" y2="90"/>
    <line x1="110" y1="72" x2="108" y2="62"/>
    <line x1="14" y1="68" x2="16" y2="58"/>
    <line x1="68" y1="110" x2="66" y2="100"/>
    <line x1="90" y1="14" x2="92" y2="6"/>
  </g>
  <!-- Darker grass shadows -->
  <g fill="#2a5a30" opacity="0.2">
    <circle cx="45" cy="75" r="8"/>
    <circle cx="15" cy="50" r="6"/>
    <circle cx="105" cy="100" r="7"/>
  </g>
</svg>
