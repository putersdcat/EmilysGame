<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- grass-02: Light meadow grass with wildflower accents -->
  <rect width="128" height="128" fill="#4a8a52"/>
  <ellipse cx="50" cy="50" rx="30" ry="25" fill="#56955c" opacity="0.5"/>
  <ellipse cx="90" cy="30" rx="20" ry="18" fill="#3e7a46" opacity="0.4"/>
  <ellipse cx="25" cy="90" rx="25" ry="20" fill="#508e56" opacity="0.45"/>
  <ellipse cx="100" cy="100" rx="22" ry="16" fill="#408248" opacity="0.4"/>
  <!-- Grass blades -->
  <g stroke="#6aaa6e" stroke-width="1" stroke-linecap="round" opacity="0.5">
    <line x1="30" y1="28" x2="28" y2="18"/>
    <line x1="60" y1="42" x2="62" y2="32"/>
    <line x1="95" y1="55" x2="93" y2="45"/>
    <line x1="15" y1="72" x2="17" y2="62"/>
    <line x1="75" y1="95" x2="73" y2="85"/>
    <line x1="45" y1="108" x2="47" y2="98"/>
    <line x1="110" y1="20" x2="108" y2="10"/>
  </g>
  <!-- Tiny wildflower dots -->
  <g opacity="0.6">
    <circle cx="35" cy="45" r="2" fill="#e8d44d"/>
    <circle cx="78" cy="70" r="1.5" fill="#d4e04d"/>
    <circle cx="95" cy="25" r="2" fill="#f0e060"/>
    <circle cx="20" cy="85" r="1.5" fill="#e0d040"/>
    <circle cx="60" cy="110" r="1.8" fill="#eed844"/>
  </g>
</svg>
