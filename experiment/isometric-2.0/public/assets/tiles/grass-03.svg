<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- grass-03: Dense dark grass (forest floor) -->
  <rect width="128" height="128" fill="#2d6838"/>
  <ellipse cx="40" cy="35" rx="24" ry="18" fill="#346e3e" opacity="0.5"/>
  <ellipse cx="85" cy="85" rx="28" ry="22" fill="#255c2e" opacity="0.5"/>
  <ellipse cx="20" cy="100" rx="18" ry="14" fill="#2a6234" opacity="0.4"/>
  <ellipse cx="100" cy="45" rx="20" ry="16" fill="#305e38" opacity="0.45"/>
  <!-- Dense blade overlay -->
  <g stroke="#3a8a44" stroke-width="1.5" stroke-linecap="round" opacity="0.45">
    <line x1="18" y1="40" x2="16" y2="28"/>
    <line x1="22" y1="42" x2="24" y2="30"/>
    <line x1="48" y1="65" x2="46" y2="53"/>
    <line x1="52" y1="67" x2="54" y2="55"/>
    <line x1="72" y1="30" x2="70" y2="18"/>
    <line x1="90" y1="95" x2="88" y2="83"/>
    <line x1="94" y1="97" x2="96" y2="85"/>
    <line x1="35" y1="105" x2="33" y2="93"/>
    <line x1="110" y1="60" x2="108" y2="48"/>
    <line x1="65" y1="115" x2="67" y2="103"/>
  </g>
  <!-- Forest debris -->
  <g fill="#1e4a22" opacity="0.3">
    <circle cx="55" cy="80" r="5"/>
    <circle cx="30" cy="60" r="4"/>
    <circle cx="95" cy="20" r="3"/>
  </g>
</svg>
