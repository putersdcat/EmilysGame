<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- sand-01: Warm beach sand with grain detail -->
  <rect width="128" height="128" fill="#c2b280"/>
  <!-- Color variation -->
  <ellipse cx="50" cy="40" rx="30" ry="22" fill="#ccbc88" opacity="0.4"/>
  <ellipse cx="85" cy="90" rx="25" ry="20" fill="#b8a670" opacity="0.35"/>
  <ellipse cx="20" cy="95" rx="22" ry="16" fill="#caba85" opacity="0.3"/>
  <ellipse cx="100" cy="25" rx="18" ry="14" fill="#baa878" opacity="0.35"/>
  <!-- Sand grain dots -->
  <g fill="#d4c690" opacity="0.4">
    <circle cx="25" cy="30" r="1.2"/>
    <circle cx="55" cy="18" r="1"/>
    <circle cx="80" cy="55" r="1.3"/>
    <circle cx="40" cy="72" r="1.1"/>
    <circle cx="110" cy="42" r="1"/>
    <circle cx="15" cy="60" r="0.9"/>
    <circle cx="68" cy="100" r="1.2"/>
    <circle cx="100" cy="80" r="1.1"/>
    <circle cx="35" cy="110" r="1"/>
    <circle cx="90" cy="15" r="0.8"/>
  </g>
  <!-- Wind ripple lines -->
  <g stroke="#b0a068" stroke-width="0.5" fill="none" opacity="0.3">
    <path d="M 5,35 Q 25,33 45,35 Q 65,37 85,35 Q 105,33 125,35"/>
    <path d="M 5,65 Q 25,63 45,65 Q 65,67 85,65 Q 105,63 125,65"/>
    <path d="M 5,95 Q 25,93 45,95 Q 65,97 85,95 Q 105,93 125,95"/>
  </g>
  <!-- Shell/debris accent -->
  <g fill="#a09060" opacity="0.3">
    <ellipse cx="70" cy="40" rx="3" ry="2" transform="rotate(30,70,40)"/>
    <ellipse cx="30" cy="88" rx="2.5" ry="1.5" transform="rotate(-15,30,88)"/>
  </g>
</svg>
