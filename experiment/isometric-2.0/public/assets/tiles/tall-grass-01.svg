<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- tall-grass-01: Dense tall grass with height variation -->
  <rect width="128" height="128" fill="#2a7a2a"/>
  <!-- Base variation -->
  <ellipse cx="45" cy="60" rx="30" ry="25" fill="#328a32" opacity="0.4"/>
  <ellipse cx="90" cy="40" rx="22" ry="18" fill="#247024" opacity="0.35"/>
  <!-- Tall grass blades (prominent, taller than grass-01) -->
  <g stroke="#4aaa4a" stroke-width="2" stroke-linecap="round" opacity="0.65">
    <line x1="15" y1="50" x2="12" y2="25"/>
    <line x1="20" y1="48" x2="22" y2="22"/>
    <line x1="35" y1="55" x2="33" y2="28"/>
    <line x1="40" y1="60" x2="42" y2="32"/>
    <line x1="55" y1="65" x2="52" y2="35"/>
    <line x1="60" y1="62" x2="62" y2="30"/>
    <line x1="75" y1="52" x2="73" y2="24"/>
    <line x1="80" y1="50" x2="82" y2="22"/>
    <line x1="95" y1="58" x2="93" y2="30"/>
    <line x1="100" y1="55" x2="102" y2="28"/>
    <line x1="115" y1="48" x2="113" y2="24"/>
  </g>
  <!-- Second layer of blades (shorter, lighter) -->
  <g stroke="#5abb5a" stroke-width="1.5" stroke-linecap="round" opacity="0.4">
    <line x1="25" y1="70" x2="23" y2="50"/>
    <line x1="45" y1="80" x2="47" y2="58"/>
    <line x1="65" y1="85" x2="63" y2="60"/>
    <line x1="85" y1="75" x2="87" y2="52"/>
    <line x1="105" y1="70" x2="103" y2="48"/>
  </g>
  <!-- Ground shadow -->
  <g fill="#1a5a1a" opacity="0.25">
    <ellipse cx="30" cy="95" rx="20" ry="8"/>
    <ellipse cx="75" cy="100" rx="22" ry="9"/>
    <ellipse cx="110" cy="90" rx="15" ry="7"/>
  </g>
</svg>
