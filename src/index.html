<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emily's Game - Isometric PoC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #1a1a1a;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      min-height: 100vh; gap: 0.5rem;
    }
    h1 { color: #fff; margin-top: 0.5rem; font-size: 1.2rem; }

    /* ── Game wrapper (relative for overlay positioning) ── */
    #gameWrapper {
      position: relative;
      width: 800px; height: 600px;
      background: #000;
      border: 3px solid #444;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    canvas {
      display: block;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: pixelated;
      width: 100%; height: 100%;
    }

    /* ── LLM Splash ── */
    #llmSplash {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #0d0d1a 100%);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      z-index: 100; gap: 1.5rem;
    }
    #llmSplash h2 { color: #88ccff; font-size: 1.8rem; }
    #llmStatus { color: #aaa; font-size: 0.95rem; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #333; border-top-color: #88ccff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Bottom HUD Overlay ── */
    #hudOverlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(10,8,18,0.92) 18%);
      pointer-events: none;
      transition: max-height 0.3s ease;
      max-height: 48px;
      overflow: hidden;
      z-index: 10;
    }
    #hudOverlay.expanded {
      max-height: 220px;
    }

    /* Icon bar (always visible row) */
    #hudBar {
      display: flex; align-items: center;
      gap: 6px; padding: 6px 10px;
      pointer-events: auto;
      height: 48px;
    }
    .hud-btn {
      width: 36px; height: 36px;
      border: 2px solid #555; border-radius: 6px;
      background: rgba(30,25,50,0.85);
      color: #e0e0e0; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .hud-btn:hover { border-color: #88ccff; background: rgba(50,45,80,0.95); }
    .hud-btn:active { background: rgba(80,70,120,0.95); }

    .hud-stat {
      color: #ffd700; font: bold 14px monospace;
      padding: 0 8px;
      white-space: nowrap;
    }
    .hud-spacer { flex: 1; }
    #llmDot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #4caf50;
      margin-right: 4px;
    }
    #llmDot.off { background: #f44336; }

    /* Expanded tray */
    #hudTray {
      pointer-events: auto;
      padding: 4px 10px 10px;
      max-height: 170px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #555 transparent;
    }
    #hudTray::-webkit-scrollbar { width: 6px; }
    #hudTray::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

    .inv-row {
      display: flex; align-items: center; gap: 8px;
      padding: 3px 4px; color: #e0e0e0;
      font: 13px monospace; border-bottom: 1px solid rgba(100,100,100,0.2);
    }
    .inv-row .emoji { font-size: 18px; }
    .inv-row .qty { color: #aaa; margin-left: auto; }

    /* Toast container (above HUD) */
    #toastContainer {
      position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column-reverse; gap: 4px;
      pointer-events: none; z-index: 11;
    }
    .toast {
      background: rgba(0,0,0,0.75);
      padding: 4px 12px; border-radius: 4px;
      font: 13px monospace; color: #fff;
      white-space: nowrap;
      animation: toastIn 0.3s ease, toastOut 0.5s ease 1.5s forwards;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }
    @keyframes toastOut { to { opacity: 0; transform: translateY(-8px); } }

    /* Dialog overlay */
    #dialogOverlay {
      position: absolute; bottom: 56px; left: 20px; right: 20px;
      background: rgba(20,15,30,0.93);
      border: 2px solid #8866aa; border-radius: 8px;
      padding: 12px 16px; display: none;
      z-index: 12; pointer-events: auto;
    }
    #dialogOverlay .npc-name { color: #ffcc00; font: bold 14px monospace; }
    #dialogOverlay .npc-text { color: #e0e0e0; font: 13px monospace; margin-top: 6px; line-height: 1.4; }
    #dialogOverlay .npc-hint { color: #888; font: 12px monospace; text-align: right; margin-top: 6px; }

    /* Quiz overlay (centered modal) */
    #quizOverlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.6);
      display: none; justify-content: center; align-items: center;
      z-index: 15;
    }
    #quizBox {
      background: rgba(25,20,40,0.95);
      border: 2px solid #6688cc; border-radius: 10px;
      padding: 20px; width: 500px; max-height: 320px;
      font: 14px monospace; color: #e0e0e0;
    }
    #quizQuestion { color: #ffdd88; font-weight: bold; margin-bottom: 12px; line-height: 1.4; }
    .quiz-choice {
      padding: 5px 8px; border-radius: 4px; cursor: default;
      margin-bottom: 2px;
    }
    .quiz-choice.selected { background: rgba(100,130,200,0.3); color: #fff; }
    .quiz-choice.correct { color: #4caf50; }
    .quiz-choice.wrong { color: #f44336; }
    #quizResult { text-align: center; margin-top: 10px; font-weight: bold; font-size: 16px; }
    #quizHint { color: #ffaa44; font-style: italic; margin-top: 6px; font-size: 12px; }
    #quizNav { color: #aaa; font-size: 12px; margin-top: 8px; }

    /* Debug overlay */
    #debugOverlay {
      position: absolute; bottom: 56px; left: 6px;
      font: 11px monospace; color: #0f0;
      pointer-events: none; z-index: 9;
    }
    #debugOverlay span {
      display: block;
      background: rgba(0,0,0,0.5);
      padding: 1px 6px; margin: 1px 0;
    }

    .controls {
      color: #aaa; font-size: 12px; max-width: 800px; padding: 0 1rem;
    }
    .controls p { margin-bottom: 0.3rem; }
    .controls strong { color: #fff; }
  </style>
</head>
<body>
  <!-- LLM Connection Gate Splash -->
  <div id="llmSplash">
    <h2>🌿 Emily's Game</h2>
    <div class="spinner"></div>
    <p id="llmStatus">Connecting to LLM...</p>
    <button id="btnSkipLlm" style="margin-top:16px;padding:8px 18px;cursor:pointer;background:#666;border:none;color:#fff;border-radius:4px;font-size:0.9rem" title="Skip LLM connection check (dev mode)">Skip (Dev)</button>
  </div>

  <h1>🌿 Emily's Game</h1>

  <div id="gameWrapper">
    <div id="gameContainer"></div>

    <!-- Debug info (toggle with F3) -->
    <div id="debugOverlay" style="display:none"></div>

    <!-- Toast notifications -->
    <div id="toastContainer"></div>

    <!-- Dialog box -->
    <div id="dialogOverlay">
      <div class="npc-name" id="dialogName"></div>
      <div class="npc-text" id="dialogText"></div>
      <div class="npc-hint" id="dialogHint"></div>
    </div>

    <!-- Quiz modal -->
    <div id="quizOverlay">
      <div id="quizBox">
        <div id="quizQuestion"></div>
        <div id="quizChoices"></div>
        <div id="quizResult"></div>
        <div id="quizHint"></div>
        <div id="quizNav"></div>
      </div>
    </div>

    <!-- Bottom HUD -->
    <div id="hudOverlay">
      <div id="hudBar">
        <span class="hud-stat" id="coinStat" title="Gold coins collected">💰 0</span>
        <span class="hud-stat" id="keyStat" title="Keys collected">🔑 0</span>
        <div class="hud-spacer"></div>
        <button class="hud-btn" id="btnInventory" title="Toggle inventory (I)">📦</button>
        <button class="hud-btn" id="btnDebug" title="Toggle debug info (F3)">🐛</button>
        <button class="hud-btn" id="btnSave" title="Save game">💾</button>
        <button class="hud-btn" id="btnExpand" title="Expand / collapse HUD panel">▲</button>
        <div id="llmDot" title="LLM connection status"></div>
      </div>
      <div id="hudTray">
        <div id="invList"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <p><strong>Controls:</strong> WASD / Arrows = Move &nbsp;|&nbsp; Space = Interact &nbsp;|&nbsp; I = Inventory &nbsp;|&nbsp; F3 = Debug</p>
  </div>
  <script type="module" src="/main.ts"></script>
</body>
</html>
