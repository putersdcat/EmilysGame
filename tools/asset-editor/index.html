<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emily's Game — Asset Editor</title>
  <style>
    /* ─── Reset / Base ──────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1a1b1e;
      --panel: #23262e;
      --panel2: #2a2d37;
      --border: #373b47;
      --text: #e0e2e8;
      --dim: #8b8fa8;
      --accent: #7c5cbf;
      --accent2: #4c9f6e;
      --danger: #b84040;
      --tile-bg: #2e3142;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      overflow: hidden;
    }

    /* ─── Layout ────────────────────────────────────────────── */
    #app {
      display: grid;
      grid-template-rows: 44px 1fr;
      grid-template-columns: 200px 1fr 320px;
      grid-template-areas:
        "header header header"
        "sidebar main variants";
      height: 100vh;
    }

    /* ─── Header ─────────────────────────────────────────────── */
    #header {
      grid-area: header;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
    }
    #header h1 {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      flex-shrink: 0;
    }
    #header .sep { flex: 1; }
    #header button {
      padding: 4px 10px;
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }
    #header button:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    #header select {
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 12px;
    }

    /* ─── Sidebar ────────────────────────────────────────────── */
    #sidebar {
      grid-area: sidebar;
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    #sidebar-search {
      padding: 8px;
      border-bottom: 1px solid var(--border);
    }
    #sidebar-search input {
      width: 100%;
      padding: 4px 8px;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 12px;
    }
    #sidebar-list { overflow-y: auto; flex: 1; }
    .sidebar-category {
      padding: 5px 10px 2px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--dim);
      background: var(--bg);
      position: sticky;
      top: 0;
    }
    .sidebar-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 5px 12px;
      background: none;
      border: none;
      color: var(--dim);
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sidebar-item:hover { background: var(--panel2); color: var(--text); }
    .sidebar-item.active { background: var(--accent); color: #fff; }

    /* ─── Main ───────────────────────────────────────────────── */
    #main {
      grid-area: main;
      display: grid;
      grid-template-rows: 40px 1fr 1fr;
      overflow: hidden;
      background: var(--bg);
    }
    #main-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    #asset-label {
      font-weight: 600;
      color: var(--text);
      min-width: 120px;
    }

    /* ─── Preview Area ───────────────────────────────────────── */
    #previews {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      overflow: hidden;
    }
    .preview-pane {
      background: var(--tile-bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .preview-pane-title {
      font-size: 10px;
      color: var(--dim);
      padding: 4px 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .preview-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow:auto;
      padding: 12px;
    }
    .preview-content canvas {
      image-rendering: pixelated;
    }
    .preview-content svg {
      max-width: 192px;
      max-height: 192px;
    }
    .preview-img {
      max-width: 192px;
      max-height: 192px;
    }

    /* ─── SVG Editor ─────────────────────────────────────────── */
    #editor-pane {
      background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #editor-pane-title {
      font-size: 10px;
      color: var(--dim);
      padding: 4px 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid var(--border);
    }
    #svg-editor {
      flex: 1;
      background: #12131a;
      color: #b8c0d8;
      border: none;
      padding: 8px 12px;
      font-family: 'Consolas', 'Fira Code', monospace;
      font-size: 11px;
      resize: none;
      outline: none;
      overflow-y: auto;
    }

    /* ─── Variants Panel ─────────────────────────────────────── */
    #variants {
      grid-area: variants;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #variants-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
    }
    #variants-header span { flex: 1; }
    #variants-header button {
      padding: 3px 8px;
      border: 1px solid var(--border);
      background: var(--accent2);
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
    }
    #variants-header button:hover { opacity: 0.85; }
    #variants-header .btn-danger { background: var(--danger); }

    #variants-panel {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .hint { color: var(--dim); font-size: 11px; padding: 8px; }
    .variant-card {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .variant-label {
      display: block;
      width: 100%;
      background: var(--bg);
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      outline: none;
    }
    .variant-preview {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--tile-bg);
      padding: 8px;
    }
    .variant-preview canvas { image-rendering: pixelated; }
    .variant-actions {
      display: flex;
      gap: 4px;
      padding: 4px 6px;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    .variant-actions button {
      flex: 1;
      padding: 3px 6px;
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      border-radius: 4px;
      cursor: pointer;
      font-size: 10px;
      white-space: nowrap;
    }
    .variant-actions button:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ─── Spinner / Error ────────────────────────────────────── */
    .spinner {
      width: 24px; height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { color: #f67; font-size: 11px; }

    /* ─── Toast ──────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--accent);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      transition: transform 0.2s;
      pointer-events: none;
      z-index: 1000;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div id="app">

  <!-- Header toolbar -->
  <header id="header">
    <h1>🎮 Asset Editor</h1>
    <label for="view-mode-select" style="color:var(--dim);font-size:11px;">View:</label>
    <select id="view-mode-select">
      <option value="iso-tile">Isometric Tile</option>
      <option value="sprite">Sprite on Tile</option>
      <option value="raw">Raw SVG</option>
    </select>
    <div class="sep"></div>
    <button id="btn-copy-svg" title="Copy SVG markup to clipboard">📋 Copy SVG</button>
    <button id="btn-export-1x" title="Export PNG at 1× scale">⬇ 1×</button>
    <button id="btn-export-2x" title="Export PNG at 2× scale">⬇ 2×</button>
    <button id="btn-export-4x" title="Export PNG at 4× scale">⬇ 4×</button>
    <button id="btn-load-custom" title="Reload preview from editor textarea" style="background:var(--accent2);border-color:var(--accent2);color:#fff;">↻ Preview</button>
  </header>

  <!-- Sidebar: asset browser -->
  <aside id="sidebar">
    <div id="sidebar-search">
      <input id="search-input" type="search" placeholder="Search assets…" oninput="filterSidebar(this.value)">
    </div>
    <div id="sidebar-list"></div>
  </aside>

  <!-- Main: previews + editor -->
  <main id="main">
    <div id="main-toolbar">
      <span id="asset-label">Select an asset →</span>
    </div>

    <div id="previews">
      <!-- Isometric / mode preview -->
      <div class="preview-pane">
        <div class="preview-pane-title">Rendered Preview</div>
        <div class="preview-content" id="preview-iso">
          <span style="color:var(--dim);font-size:11px;">Select an asset from the sidebar</span>
        </div>
      </div>

      <!-- Raw SVG inline preview -->
      <div class="preview-pane">
        <div class="preview-pane-title">Raw SVG (direct)</div>
        <div class="preview-content" id="preview-raw"></div>
      </div>
    </div>

    <!-- SVG editor -->
    <div id="editor-pane">
      <div id="editor-pane-title">SVG Markup — edit to update preview (400ms debounce)</div>
      <textarea id="svg-editor" spellcheck="false" placeholder="Paste or edit SVG markup here…"></textarea>
    </div>
  </main>

  <!-- Variants / A-B panel -->
  <aside id="variants">
    <div id="variants-header">
      <span>A/B Variants</span>
      <button id="btn-add-variant" title="Save current SVG as a new variant">+ Add Variant</button>
      <button id="btn-clear-votes" class="btn-danger" title="Reset all votes">Reset Votes</button>
    </div>
    <div id="variants-panel">
      <p class="hint">Click "+ Add Variant" to save the current SVG for comparison. Vote with 👍 to rank variants.</p>
    </div>
  </aside>

</div>

<div id="toast"></div>

<script src="assets-manifest.js"></script>
<script src="editor.js"></script>
<script>
  // Sidebar search filter
  function filterSidebar(query) {
    const q = query.toLowerCase();
    document.querySelectorAll('.sidebar-item').forEach(btn => {
      const match = !q || btn.textContent.toLowerCase().includes(q) || btn.title.toLowerCase().includes(q);
      btn.style.display = match ? '' : 'none';
    });
    document.querySelectorAll('.sidebar-category').forEach(hdr => {
      // Hide category header if all items hidden
      let next = hdr.nextElementSibling;
      let hasVisible = false;
      while (next && !next.classList.contains('sidebar-category')) {
        if (next.style.display !== 'none') hasVisible = true;
        next = next.nextElementSibling;
      }
      hdr.style.display = hasVisible ? '' : 'none';
    });
  }
</script>
</body>
</html>
